# Collects the ThousandEyes OpenAPI specification and opens a pull request when it
# has changed since the last snapshot.
#
# Cisco publishes the v7 specifications through DevNet's pubhub CDN, which is
# public, so unlike the equivalent workflow in go-sdk-jamfpro-v2 this needs no
# repository secrets — only the default GITHUB_TOKEN to raise the pull request.
#
# The heavy lifting lives in ./scripts/openapi/GetOpenAPISpecs, which resolves the
# specification through the upstream catalogue, compares it against the newest
# snapshot in openapi-specs/ and reports whether anything changed. This workflow
# only wires that up to a pull request.
name: Maintainence | Get OpenAPI specs

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and compare without writing a snapshot or opening a PR'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fetch-specs:
    name: '📥 Fetch OpenAPI specs'
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
          cache: true

      - name: Download Dependencies
        run: |
          echo "::group::📦 Downloading Go modules"
          go mod download
          go mod verify
          echo "::endgroup::"

      - name: Collect specification
        id: collect
        run: |
          echo "::group::🔍 Fetching ThousandEyes OpenAPI specification"
          go run ./scripts/openapi/GetOpenAPISpecs ${{ inputs.dry_run && '-dry-run' || '' }}
          echo "::endgroup::"

      # A spec update that is not accompanied by regenerated code leaves the SDK
      # stale on merge, so the PR carries both and is self-consistent.
      - name: Regenerate service packages
        if: steps.collect.outputs.changed == 'true' && !inputs.dry_run
        run: |
          echo "::group::🔁 Regenerating against the new specification"
          go run ./scripts/openapi/GenerateServices
          echo "::endgroup::"

          if git diff --quiet -- thousandeyes/; then
            echo "generated_changed=false" >> "$GITHUB_OUTPUT"
            echo "Specification changed but the generated surface did not."
          else
            echo "generated_changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- thousandeyes/
          fi
        id: regenerate

      # Regenerated output must compile and pass its tests before a PR is opened;
      # an upstream schema change can produce output that does not build.
      - name: Build and test regenerated code
        if: steps.collect.outputs.changed == 'true' && !inputs.dry_run
        run: |
          go build ./...
          go test ./internal/... ./thousandeyes/...

      - name: Report outcome
        run: |
          if [ "${{ steps.collect.outputs.changed }}" = "true" ]; then
            echo "### 📥 Specification changed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat "${{ steps.collect.outputs.body_path }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ No change" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The published specification matches the newest snapshot (${{ steps.collect.outputs.summary }})." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The pull request body is generated by the collector rather than templated
      # here, so it can describe the actual operation-level changes.
      - name: Create Pull Request
        if: steps.collect.outputs.changed == 'true' && !inputs.dry_run
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.collect.outputs.branch }}
          commit-message: ${{ steps.collect.outputs.title }}
          title: ${{ steps.collect.outputs.title }}
          body-path: ${{ steps.collect.outputs.body_path }}
          add-paths: |
            openapi-specs
            thousandeyes
          labels: openapi
