# Fails when the committed generated code no longer matches the specification it
# was generated from.
#
# Roughly 90k lines under thousandeyes/thousandeyes_api are produced by
# scripts/openapi/GenerateServices. Nothing stops a change to the generator, the
# templates or a spec snapshot from landing without the output being
# regenerated, and stale generated code compiles perfectly well — so the drift
# would be invisible. This regenerates and fails if anything moved.
name: go | Verify generated code

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/codegen-verify.yml'
      - 'internal/codegen/**'
      - 'internal/templates/**'
      - 'openapi-specs/**'
      - 'scripts/openapi/**'
      - 'thousandeyes/thousandeyes_api/**'
      - 'thousandeyes/thousandeyes.go'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: '🔁 Regenerate and diff'
    runs-on: ubuntu-24.04-arm
    if: github.event.pull_request.draft == false

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check Out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
          cache: true

      - name: Download Dependencies
        run: |
          echo "::group::📦 Downloading Go modules"
          go mod download
          go mod verify
          echo "::endgroup::"

      # The generator reads the newest snapshot in openapi-specs/, so this needs
      # no network access.
      - name: Regenerate
        run: |
          echo "::group::🔁 Regenerating service packages"
          go run ./scripts/openapi/GenerateServices
          echo "::endgroup::"

      - name: Check for drift
        run: |
          if git diff --quiet; then
            echo "✅ Generated code matches the specification."
            exit 0
          fi

          echo "::error::Generated code is out of date. Run 'go run ./scripts/openapi/GenerateServices' and commit the result."
          {
            echo "### ❌ Generated code is out of date"
            echo ""
            echo "Run this locally and commit the result:"
            echo ""
            echo '```bash'
            echo 'go run ./scripts/openapi/GenerateServices'
            echo '```'
            echo ""
            echo "<details><summary>Files that differ</summary>"
            echo ""
            echo '```'
            git diff --stat
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          git diff --stat
          exit 1

      # Regenerated output must also still compile and pass its tests, since a
      # generator change can produce a clean diff and broken code.
      - name: Build and test
        run: |
          echo "::group::🔨 Build"
          go build ./...
          echo "::endgroup::"
          echo "::group::🧪 Test"
          go test ./internal/... ./thousandeyes/...
          echo "::endgroup::"
